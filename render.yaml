services:
  - type: web
    name: stetech-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: QUEUE_CONNECTION
        value: redis
      - key: CACHE_STORE
        value: redis
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: stetech-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: stetech-postgres
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: stetech-postgres
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: stetech-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: stetech-postgres
          property: password
      - key: REDIS_HOST
        fromService:
          name: stetech-redis
          property: host
      - key: REDIS_PORT
        fromService:
          name: stetech-redis
          property: port
      - key: AI_SERVICE_URL
        fromService:
          name: stetech-ai-service
          property: hostport
      - key: APP_KEY
        sync: false

  - type: web
    name: stetech-ai-service
    runtime: docker
    dockerfilePath: ./ai-service/Dockerfile
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: AI_SERVICE_TOKEN
        sync: false

  - type: keyvalue
    name: stetech-redis
    plan: starter

databases:
  - name: stetech-postgres
    plan: starter
